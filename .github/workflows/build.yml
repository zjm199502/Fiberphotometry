# Builds the desktop app for Windows and macOS and runs the tests.
# Produces a Windows Setup.exe and macOS .dmg installers; download them from the run's "Artifacts" section.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest       # Apple silicon (M1 and newer)
            arch: AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[gui,test] pyinstaller
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Build
        run: pyinstaller packaging/fiberphoto.spec --noconfirm
      - name: Version
        shell: bash
        run: echo "VER=$(python -c 'import fiberphoto; print(fiberphoto.__version__)')" >> "$GITHUB_ENV"
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
              $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
            } else {
              choco install innosetup -y --no-progress
              $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
            }
          }
          iscc /DAppVersion=$env:VER packaging\windows_installer.iss
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/make_dmg.sh "$VER" "${{ matrix.arch }}"
      - name: Verify Windows installation, reinstall and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'FiberPhoto Install'
          $qa = Join-Path $env:RUNNER_TEMP 'fiberphoto-qa'
          $setup = (Get-Item installer/*-Setup.exe).FullName
          function Invoke-Checked($file, $arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              if (Test-Path "$qa/verify-error.txt") { Get-Content "$qa/verify-error.txt" }
              throw "$file exited with $($p.ExitCode)"
            }
          }
          1..2 | ForEach-Object {
            Invoke-Checked $setup "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$dir`""
            Invoke-Checked "$dir/fiberphoto.exe" "--verify-install `"$qa`""
          }
          Invoke-Checked "$dir/unins000.exe" '/VERYSILENT /NORESTART'
          if ((Test-Path "$dir/fiberphoto.exe") -or !(Test-Path "$qa/data/mouse01_session1.tdms")) {
            throw 'Unexpected state after uninstall'
          }
      - name: Verify macOS disk image
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mount="$RUNNER_TEMP/fiberphoto-mount"
          hdiutil attach installer/*.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          "$mount/FiberPhoto.app/Contents/MacOS/fiberphoto" --verify-install "$RUNNER_TEMP/fiberphoto-qa" || {
            cat "$RUNNER_TEMP/fiberphoto-qa/verify-error.txt"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FiberPhoto-${{ env.VER }}-${{ runner.os }}-${{ matrix.arch }}
          path: installer/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          win="installers/FiberPhoto-$version-Windows-Setup.exe"
          mac="installers/FiberPhoto-$version-macOS-AppleSilicon.dmg"
          test -s "$win" && test -s "$mac"
          gh release create "$GITHUB_REF_NAME" "$win" "$mac" --verify-tag --title "FiberPhoto $version" --notes-file "packaging/releases/$version.md"
