# Builds the desktop app for Windows and macOS and runs the tests.
# Produces a Windows Setup.exe and macOS .dmg installers; download them from the run's "Artifacts" section.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest       # Apple silicon (M1 and newer)
            arch: AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[gui,test] pyinstaller
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Build
        run: pyinstaller packaging/fiberphoto.spec --noconfirm
      - name: Version
        shell: bash
        run: echo "VER=$(python -c 'import fiberphoto; print(fiberphoto.__version__)')" >> "$GITHUB_ENV"
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
              $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
            } else {
              choco install innosetup -y --no-progress
              $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
            }
          }
          iscc /DAppVersion=$env:VER packaging\windows_installer.iss
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/make_dmg.sh "$VER" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: FiberPhoto-${{ env.VER }}-${{ runner.os }}-${{ matrix.arch }}
          path: installer/*
