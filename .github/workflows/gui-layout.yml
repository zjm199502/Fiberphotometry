name: Native desktop layout
on:
  push:
    branches: [codex/gui-qa-066]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: ${{ matrix.os }} at ${{ matrix.scale }}x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        scale: ['1', '1.5']
    env:
      PYTHONUTF8: '1'
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'cocoa' }}
      FIBERLUME_LAYOUT_ARTIFACTS: layout-images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[gui,test]"
      - run: python -m pytest tests/test_gui_layout.py -q --disable-warnings
      - name: Open the installed macOS application with the candidate patch
        if: runner.os == 'macOS' && matrix.scale == '1'
        run: |
          qa="$RUNNER_TEMP/native-patch"
          python packaging/patch_channel.py stage "$qa"
          python -c "import runpy, sys; from pathlib import Path; runpy.run_path('tests/conftest.py')['write_abet_xml'](Path(sys.argv[1]))" "$qa/sample_PhotoData.xml"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/base.dmg" https://github.com/zjm199502/Fiberphotometry/releases/download/v0.6.0/FiberLume-0.6.0-macOS-AppleSilicon.dmg
          mount="$RUNNER_TEMP/fiberlume-mounted"
          hdiutil attach "$RUNNER_TEMP/base.dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          "$mount/FiberLume.app/Contents/MacOS/fiberphoto" --verify-install "$qa" || { cat "$qa/verify-error.txt"; exit 1; }
          cmp "$qa/expected-version.txt" "$qa/running-version.txt"
          test -s "$qa/plexon-results/sample_PhotoData/abet/locked/overview.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-${{ matrix.os }}-${{ matrix.scale }}
          path: layout-images/
          if-no-files-found: warn
